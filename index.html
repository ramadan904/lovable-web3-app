<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Your wallet, with a bodyguard: Scam Shield, Approval Guard, Whale Watch, Wallet Wrapped, payment links and more." />
    <meta name="apple-mobile-web-app-title" content="Lovable Web3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lovable Web3 App</title>
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
